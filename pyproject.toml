[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "toothspin"
version = "0.1.5"
description = "Bluetooth audio input for Sendspin and Music Assistant"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    # Pinned to what Music Assistant 2.10.6 ships (aiosendspin[server]==9.1.1):
    # 10.x renamed the client_stream/* messages a 9.1.1 server expects.
    # The default PCM codec needs no extras; FLAC/Opus need the "codecs" extra.
    "aiosendspin==9.1.1",
    "dbus-fast==5.2.0",
]

[project.urls]
Homepage = "https://github.com/eknoes/toothspin"
Source = "https://github.com/eknoes/toothspin"
Issues = "https://github.com/eknoes/toothspin/issues"
Changelog = "https://github.com/eknoes/toothspin/releases"

[project.optional-dependencies]
codecs = ["aiosendspin[source]==9.1.1"]
test = ["pytest>=8", "pytest-timeout>=2", "aiosendspin[server]==9.1.1", "numpy>=1.26"]

[project.scripts]
toothspin = "toothspin.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
toothspin = ["*.html", "static/*"]
