[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "toothspin"
version = "0.5.1"
description = "Bluetooth audio input for Sendspin and Music Assistant"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    # Pinned to what Music Assistant 2.10.8 ships (aiosendspin[server]==10.2.1;
    # 2.10.7 has 10.2.0): a 10.x client can't talk to the 9.1.1 server of MA
    # 2.10.6 and older.
    # The default PCM codec needs no extras; FLAC/Opus need the "codecs" extra.
    "aiosendspin==10.2.1",
    "dbus-fast==5.2.0",
]

[project.urls]
Homepage = "https://github.com/eknoes/toothspin"
Source = "https://github.com/eknoes/toothspin"
Issues = "https://github.com/eknoes/toothspin/issues"
Changelog = "https://github.com/eknoes/toothspin/releases"

[project.optional-dependencies]
codecs = ["aiosendspin[source]==10.2.1"]
# Standalone mode, ToothSpin's own Sendspin server (PyAV, numpy, Pillow: big).
server = ["aiosendspin[server]==10.2.1"]
test = [
  "pytest>=8", "pytest-timeout>=2", "aiosendspin[server]==10.2.1", "numpy>=1.26", "ruff==0.17.1",
]

[project.scripts]
toothspin = "toothspin.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
toothspin = ["*.html", "static/*"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# Security checks (bandit's rules); CI fails on new findings.
select = ["S"]
# assert only narrows types here, it never guards anything.
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
