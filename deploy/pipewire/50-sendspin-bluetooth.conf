# WirePlumber drop-in for the headless receiver:
# Installed in the image as /etc/wireplumber/wireplumber.conf.d/50-sendspin-bluetooth.conf
wireplumber.profiles = {
  main = {
    # No logind seat on a headless VM; without this the bluez monitor
    # stays off until someone logs in on a console.
    monitor.bluez.seat-monitoring = disabled
  }
}

monitor.bluez.properties = {
  # A2DP sink only: no HFP/HSP, so calls can't switch the phone's profile.
  bluez5.roles = [ a2dp_sink ]
  bluez5.hfphsp-backend = none
}

monitor.bluez.rules = [
  {
    # Never idle-suspend a phone's stream: suspending it sends AVDTP SUSPEND,
    # and phones (Pixel, iPhone) then don't restart until playback is
    # toggled.
    matches = [ { node.name = "~bluez_input.*" } ]
    actions = {
      update-props = {
        # Expose the phone as a capture source (Audio/Source) instead of a
        # playback stream, so pw-record can read it. This is a node
        # property; it has no effect in monitor.bluez.properties.
        bluez5.media-source-role = input
        session.suspend-timeout-seconds = 0
        # PipeWire only acquires a phone's stream once its node runs, and an
        # input node only runs when something records from it. Without this
        # a phone that starts while nobody records gets suspended by BlueZ
        # and then doesn't restart on its own.
        node.always-process = true
      }
    }
  }
  {
    # WirePlumber leaves a phone's profile "off" by default; select the one
    # where the phone is the A2DP source ("audio gateway" describes the phone).
    matches = [ { device.name = "~bluez_card.*" } ]
    actions = { update-props = { bluez5.profile = "audio-gateway" } }
  }
]
