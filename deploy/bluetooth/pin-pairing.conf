# Drop-in for bluetooth.service, only for BT_PIN: phones only ask for a PIN
# when the adapter has Secure Simple Pairing off. Install as
# /etc/systemd/system/bluetooth.service.d/toothspin-pin.conf, then restart
# bluetooth.service. Without it, phones pair without a PIN ("Just Works"),
# which needs ToothSpin's pairing window. Phones paired before keep working.
# For another adapter than hci0 (BT_ADAPTER), change the index.
[Service]
ExecStartPost=/usr/bin/btmgmt --index 0 ssp off
