# Replaces the stock (all-commented) /etc/bluetooth/main.conf.
# Pairable/Discoverable are toggled at runtime by the sendspin-bluetooth
# service's pairing window, so they're left off here.
[General]
# Major class Audio/Video, minor Loudspeaker: phones list us as a speaker.
# BlueZ ORs in the Audio/Rendering service bits once PipeWire registers
# its A2DP sink endpoints.
Class = 0x000414
DiscoverableTimeout = 0
PairableTimeout = 0
FastConnectable = true

[Policy]
AutoEnable = true
