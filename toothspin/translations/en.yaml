configuration:
  bluetooth_name:
    name: Bluetooth name
    description: The name phones see when they search for Bluetooth devices.
  input_name:
    name: Input name in Music Assistant
    description: >-
      Default name of each phone's input in Music Assistant. {device} is the
      phone's Bluetooth name. Each input can also be renamed in the app.
  adapter:
    name: Bluetooth adapter
    description: >-
      The adapter phones connect to: hci0 (default) is the first one. With
      a dongle just for ToothSpin, set it here (e.g. hci1), or auto to pick
      one Home Assistant's Bluetooth integration doesn't use.
  start_volume:
    name: Maximum start volume
    description: >-
      When a phone starts playing on a speaker that is set louder than this
      (0-100), ToothSpin turns it down to this volume first, so a speaker
      someone left loud doesn't blast. Speakers set quieter keep their
      volume, and afterwards you can turn up as you like. 100 (default)
      never changes a speaker's volume.
  allow_phone_connect:
    name: Phones may connect by themselves
    description: >-
      On (default): paired phones connect by themselves, like to any
      Bluetooth speaker. Off: connections only start from the app, so a
      phone coming home doesn't start playing through the house.
  ma_token:
    name: Music Assistant token
    description: >-
      Recommended. A long-lived token from Music Assistant (your profile,
      Tokens). Lets you pick speakers per phone in the app and pairs phones
      with Music Assistant automatically.
  ma_url:
    name: Music Assistant URL
    description: >-
      Only needed if Music Assistant isn't found automatically, e.g.
      http://homeassistant.local:8095.
  sendspin_url:
    name: Sendspin server URL
    description: >-
      Only needed if Music Assistant's Sendspin server isn't found
      automatically, e.g. ws://homeassistant.local:8927/sendspin.
  take_bluetooth_audio:
    name: Take Bluetooth audio from Home Assistant
    description: >-
      Home Assistant's own audio service also receives Bluetooth audio and
      takes the phones' streams. On: ToothSpin turns that off there, also
      after it restarts. Home Assistant's audio service then can't use
      Bluetooth speakers or headsets. ToothSpin asks before turning it on.
  log_level:
    name: Log level
    description: How much the app logs.
network:
  8080/tcp: >-
    Web interface on your network, without Home Assistant's login. Leave
    empty to only use it through Home Assistant.
