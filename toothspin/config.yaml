# https://developers.home-assistant.io/docs/apps/configuration
name: ToothSpin
version: "0.4.0"
slug: toothspin
description: Stream any phone over Bluetooth into Music Assistant
url: https://github.com/eknoes/toothspin
image: ghcr.io/eknoes/toothspin
arch:
  - aarch64
  - amd64
# No host network: Music Assistant (its App runs on the host) is reached via
# the host's address on Home Assistant's internal network.
# Uses the host's BlueZ (bluetoothd) over D-Bus; no raw Bluetooth access.
host_dbus: true
# Only to read the App's ingress port and port mapping, and to show the app
# in the sidebar on its first start.
hassio_api: true
# Home Assistant's audio service also receives Bluetooth audio and takes the
# phones' streams; with the user's consent, ToothSpin turns that off there.
audio: true
# Only to check whether Home Assistant's Bluetooth integration uses the
# adapter too, and to raise a notification when setup needs the user.
homeassistant_api: true
ingress: true
# Optional: the web interface on the network, without Home Assistant's login.
ports:
  8080/tcp: null
panel_icon: mdi:home-sound-in
panel_title: ToothSpin
options:
  bluetooth_name: ToothSpin
  input_name: "{device} (Bluetooth)"
  adapter: hci0
  ma_token: ""
  start_volume: 100
  allow_phone_connect: true
  take_bluetooth_audio: false
  other_adapters_pairing: accept
  log_level: info
schema:
  bluetooth_name: str
  input_name: str
  adapter: match(^(auto|hci[0-9]+)$)
  start_volume: int(0,100)
  allow_phone_connect: bool
  take_bluetooth_audio: bool
  other_adapters_pairing: list(accept|refuse)
  ma_token: password?
  ma_url: url?
  sendspin_url: match(^wss?://.+)?
  log_level: list(debug|info|warning|error)
