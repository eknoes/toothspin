<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="static/manifest.webmanifest">
<!-- PNG only, with sizes: Firefox for Android picks an SVG "any" icon for
     home-screen shortcuts and then falls back to a generic one. -->
<link rel="icon" href="static/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="static/icon-192.png" sizes="192x192" type="image/png">
<link rel="icon" href="static/icon-512.png" sizes="512x512" type="image/png">
<link rel="apple-touch-icon" href="static/apple-touch-icon.png" sizes="180x180">
<meta name="theme-color" content="#0F1B2D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ToothSpin">
<title>ToothSpin</title>
<style>
  /* Palette from the ToothSpin icon / Pages site: ground #0F1B2D, hub
     #F5F4EC, Bluetooth blue for connection state, Sendspin red as the
     accent for controls. Light mode uses the darker blue/red so text on
     them stays readable. */
  :root {
    --bg: #F4F4F2; --card: #FFFFFF; --text: #0F1B2D; --muted: #5B6575;
    --line: #E3E3DE; --accent: #C4473A; --accent-text: #FFFFFF;
    --ok: #2A6FD1; --warn: #D97706; --danger: #C4473A;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0F1B2D; --card: #16253B; --text: #F5F4EC; --muted: #9AA6B8;
      --line: #26364F; --accent: #E25C4C; --accent-text: #0F1B2D;
      --ok: #4C9BFF; --warn: #F0A848; --danger: #EF958A;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    /* Room for the status bar / home indicator when installed as an app. */
    padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px));
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; display: grid; gap: 16px; }
  h1 { font-size: 20px; margin: 0; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { border-radius: 10px; flex-shrink: 0; }
  .brand .tagline { font-size: 13px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
       color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  section { background: var(--card); border: 1px solid var(--line);
            border-radius: 12px; padding: 16px; }
  .muted { color: var(--muted); }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .row > .grow { flex: 1; min-width: 0; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 10px 0; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; padding-top: 0; }
  button {
    font: inherit; border-radius: 8px; padding: 7px 14px; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--text);
  }
  button.primary { background: var(--accent); border-color: var(--accent);
                   color: var(--accent-text); font-weight: 600; }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .5; cursor: default; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
         background: var(--line); margin-right: 6px; vertical-align: 1px; }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); }
  .pin { font: 600 40px/1.1 ui-monospace, monospace; letter-spacing: .15em;
         margin: 8px 0; }
  .notice { border-left: 3px solid var(--accent); padding: 8px 12px; margin-top: 12px; }
  .error { color: var(--danger); }
  .track { font-size: 16px; margin: 6px 0 2px; }
  .phone { display: grid; gap: 4px; }
  .phone + .phone { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
  .phone .title { display: flex; align-items: center; gap: 4px; font-size: 16px; }
  .phone .title .icon { border: none; padding: 4px; color: var(--muted); }
  .phone .title .icon svg { width: 15px; height: 15px; }
  .phone .sub { color: var(--muted); font-size: 12px; margin-top: -2px; }
  .phone.mine { border-left: 3px solid var(--accent); padding-left: 12px; margin-left: -15px; }
  .phone .title .star { margin-left: auto; }
  .phone .title .star.on { color: var(--accent); }
  .name-input { font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line);
                background: transparent; color: inherit; flex: 1; min-width: 0; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .spks { display: grid; gap: 2px; margin-top: 4px; }
  .spk { display: grid; grid-template-columns: auto minmax(0, 1fr) 2.2em minmax(70px, 150px) 2.2em auto auto;
         align-items: center; gap: 10px; padding: 4px 0; }
  .spk .spk-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .spk .other { color: var(--muted); font-size: 12px; }
  .spk input[type=range] { width: 100%; accent-color: var(--accent); }
  .spk .vol { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; text-align: right; }
  /* Takes the place of the slider and its value. */
  .spk .fixed-vol { grid-column: span 2; color: var(--muted); font-size: 13px; }
  .switch { width: 38px; height: 22px; padding: 0; border-radius: 999px; position: relative;
            background: var(--line); border: none; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px;
                   border-radius: 50%; background: var(--card); transition: left .15s; }
  .switch.on { background: var(--accent); }
  .switch.on::after { left: 19px; }
  .switch.busy { opacity: .6; }
  .icon { padding: 4px 6px; line-height: 0; }
  .icon svg { width: 18px; height: 18px; }
  /* Hidden speakers: faded and at the bottom, fully visible when used. */
  .spk.hidden-spk { opacity: .35; }
  .spk.hidden-spk:hover, .spk.hidden-spk:focus-within { opacity: .9; }
  .spk .hide { color: var(--muted); }
  .spk .move { color: var(--muted); }
  .spk .move:hover { color: var(--accent); }
  .icon.muted { color: var(--danger); }
  @media (max-width: 520px) {
    /* Name on its own line, slider + volume + mute below. */
    .spk { grid-template-columns: auto minmax(0, 1fr) 2.2em auto; row-gap: 2px; padding: 6px 0; }
    .spk .spk-name { grid-column: 2; }
    .spk .move-cell { grid-column: 3; grid-row: 1; }
    .spk .hide { grid-column: 4; grid-row: 1; }
    .spk input[type=range] { grid-column: 1 / 3; }
    .spk .fixed-vol { grid-column: 1 / 4; }
  }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>
<main>
  <header class="brand">
    <img src="static/icon.svg" alt="" width="44" height="44">
    <div>
      <h1>ToothSpin</h1>
      <div class="muted tagline">Bluetooth audio input for Music Assistant</div>
    </div>
  </header>

  <section>
    <h2>Phones</h2>
    <div id="devices"></div>
  </section>

  <section>
    <div class="row">
      <div class="grow" id="bt-pairing-text"></div>
      <button class="primary" id="bt-pairing-btn"></button>
    </div>
    <div class="muted" id="subtitle" style="margin-top:8px;font-size:13px"></div>
  </section>

  <div class="error" id="error"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
let state = null;
let confirmRemove = null;
// Address of the phone whose Music Assistant name is being edited. Rendering
// pauses meanwhile so the 1.5 s refresh doesn't wipe the text field.
let editing = null;
// The phone this browser/app belongs to, chosen with the star. A web page
// can't tell which Bluetooth phone it runs on, so it's remembered here.
let myPhone = null;
try { myPhone = localStorage.getItem("myPhone"); } catch (e) {}
function setMyPhone(address) {
  myPhone = myPhone === address ? null : address;
  try { myPhone ? localStorage.setItem("myPhone", myPhone) : localStorage.removeItem("myPhone"); } catch (e) {}
  render();
}
// Speaker toggles in flight, as "address|player_id".
const pending = new Set();
// True while a volume slider is being dragged (pauses rendering).
let sliding = false;
const ICON_SOUND = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>`;
const ICON_MUTED = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>`;

async function post(path, body) {
  const res = await fetch(path, {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body ?? {}),
  });
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    $("error").textContent = data.error || `Request failed (${res.status})`;
  } else {
    $("error").textContent = "";
  }
  await refresh();
}

function renderAudio(d) {
  if (!d.connected) return `<div class="muted">Not connected</div>`;
  if (!d.audio) return `<div class="muted">Connected, not streaming</div>`;
  const np = d.audio.now_playing, ss = d.sendspin;
  const track = np && np.title
    ? `<div class="track"><b>${esc(np.title)}</b>${np.artist ? ` — ${esc(np.artist)}` : ""}</div>`
    : "";
  return `${track}<div><span class="dot ${ss && ss.signal ? "ok" : ""}"></span>
      ${ss && ss.signal ? "Playing" : "Silent"} · ${esc(d.audio.codec || "Bluetooth")} ·
      ${!ss || !ss.requested ? "not playing in Music Assistant"
        : ss.streaming ? "streaming to Music Assistant" : "starting stream…"}</div>`;
}

function renderSendspin(d) {
  const ss = d.sendspin;
  if (!ss) return "";
  let html;
  if (!ss.connected) {
    html = `<div class="muted"><span class="dot"></span>Music Assistant: not connected
              ${ss.url ? "(" + esc(ss.url) + ")" : "(searching…)"}</div>`;
  } else if (ss.paired) {
    html = `<div class="muted"><span class="dot ok"></span>Music Assistant: paired</div>`;
  } else if (state.auto_pairing) {
    // ToothSpin pairs it through Music Assistant's API by itself.
    return `<div class="muted"><span class="dot warn"></span>Music Assistant: pairing…</div>`;
  } else {
    html = `<div><span class="dot warn"></span>Music Assistant: not paired yet</div>`;
  }
  if (ss.pin) {
    html += `<div class="notice">Enter this code in Music Assistant:<div class="pin">${esc(ss.pin)}</div></div>`;
  } else if (ss.pairing_requested) {
    html += `<div class="notice row"><div class="grow">Music Assistant wants to pair “${esc(ss.name)}”.</div>
               <button class="primary" data-pair="${esc(d.address)}">Allow</button></div>`;
  } else if (ss.connected && !ss.paired) {
    html += `<div class="notice">In Music Assistant's settings, open “${esc(ss.name)}” and choose
               <b>Pair the device</b>, then allow it here.
               <div style="margin-top:8px"><button data-pair="${esc(d.address)}" ${ss.pairing_window_open ? "disabled" : ""}>
               ${ss.pairing_window_open ? "Pairing allowed — waiting for Music Assistant" : "Allow pairing"}</button></div></div>`;
  }
  return html;
}

function renderSpeakers(d) {
  const sp = state.speakers;
  if (!sp || !d.sendspin || !d.sendspin.paired) return "";
  if (!sp.connected) return `<div class="label">Speakers</div><div class="muted">Music Assistant API not reachable</div>`;
  const owner = {};
  for (const other of state.devices) if (other.source_uri) owner[other.source_uri] = other.name;
  const selected = sp.list.filter((s) => s.playing_uri === d.source_uri);
  const leader = selected.find((s) => !s.synced_to);
  // Hidden speakers go to the bottom, otherwise MA's (alphabetical) order.
  const hidden = new Set(d.hidden_speakers || []);
  const ordered = [...sp.list].sort((a, b) => hidden.has(a.player_id) - hidden.has(b.player_id));
  const rows = ordered.map((s) => {
    const isHidden = hidden.has(s.player_id);
    const on = s.playing_uri === d.source_uri;
    const blocked = !on && leader && !leader.can_group_with.includes(s.player_id);
    const key = `${d.address}|${s.player_id}`;
    const usedBy = !on && s.playing_uri ? owner[s.playing_uri] || "another input" : null;
    const title = blocked ? `Can't play in sync with ${leader.name}`
      : usedBy ? `Playing ${usedBy}; turning it on moves it here` : on ? "Turn off" : "Play here";
    const vol = s.volume ?? 0;
    // Switching rooms in one go: offered while the phone plays elsewhere.
    const canMove = leader && !(on && selected.length === 1) && !pending.has(key);
    return `<div class="spk ${isHidden ? "hidden-spk" : ""}">
        <button class="switch ${on ? "on" : ""} ${pending.has(key) ? "busy" : ""}" aria-pressed="${on}"
          aria-label="${esc(s.name)}" data-speaker="${esc(s.player_id)}" data-on="${on ? "0" : "1"}"
          data-addr="${esc(d.address)}" ${blocked || pending.has(key) ? "disabled" : ""} title="${esc(title)}"></button>
        <span class="spk-name ${blocked ? "muted" : ""}" title="${esc(title)}">${esc(s.name)}${usedBy ? ` <span class="other">· ${esc(usedBy)}</span>` : ""}</span>
        <span class="move-cell">${canMove ? `<button class="icon move" data-move="${esc(s.player_id)}"
          data-addr="${esc(d.address)}" aria-label="Play only on ${esc(s.name)}"
          title="Play only here">${ICON_MOVE}</button>` : ""}</span>
        ${s.has_volume ? `<input type="range" min="0" max="100" value="${vol}" data-vol="${esc(s.player_id)}"
          aria-label="Volume ${esc(s.name)}">
        <span class="vol">${vol}</span>`
        : `<span class="fixed-vol" title="This speaker's volume is set on the speaker or its amplifier">Fixed volume</span>`}
        <button class="icon ${s.muted ? "muted" : ""}" data-mute="${esc(s.player_id)}" data-muted="${s.muted ? "0" : "1"}"
          aria-label="${s.muted ? "Unmute" : "Mute"} ${esc(s.name)}" title="${s.muted ? "Unmute" : "Mute"}"
          ${s.has_volume || s.has_mute ? "" : "disabled"}>${s.muted ? ICON_MUTED : ICON_SOUND}</button>
        <button class="icon hide" data-hide="${esc(s.player_id)}" data-hidden="${isHidden ? "0" : "1"}"
          data-addr="${esc(d.address)}" aria-pressed="${isHidden}"
          aria-label="${isHidden ? "Show" : "Hide"} ${esc(s.name)}"
          title="${isHidden ? "Show this speaker again" : "Hide this speaker for this phone"}">${isHidden ? ICON_EYE_OFF : ICON_EYE}</button>
      </div>`;
  }).join("");
  return `<div class="label">Speakers</div><div class="spks">${rows || '<span class="muted">No speakers available</span>'}</div>`;
}

const ICON_STAR = (on) => `<svg viewBox="0 0 24 24" fill="${on ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>`;
const ICON_EYE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>`;
const ICON_EYE_OFF = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-2.6 3.5M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a10 10 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="m2 2 20 20"/></svg>`;
const ICON_MOVE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h13"/><path d="m11 6 6 6-6 6"/><path d="M21 4v16"/></svg>`;
const ICON_PENCIL = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.8 2.8 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>`;

function renderTitle(d) {
  const ss = d.sendspin;
  const title = ss ? ss.name : d.name;
  const head = editing === d.address
    ? `<div class="row"><input id="name-input" class="name-input" value="${esc(title)}" maxlength="64"
         aria-label="Name in Music Assistant">
         <button class="primary" data-save="${esc(d.address)}">Save</button>
         <button data-cancel="1">Cancel</button></div>`
    : `<div class="title"><span class="dot ${d.connected ? "ok" : ""}"></span><b>${esc(title)}</b>
         ${ss ? `<button class="icon" data-rename="${esc(d.address)}" title="Rename in Music Assistant"
           aria-label="Rename">${ICON_PENCIL}</button>` : ""}
         <button class="icon star ${myPhone === d.address ? "on" : ""}" data-mine="${esc(d.address)}"
           title="${myPhone === d.address ? "This is my phone" : "Mark as my phone (shown first)"}"
           aria-pressed="${myPhone === d.address}" aria-label="This is my phone">${ICON_STAR(myPhone === d.address)}</button></div>`;
  return `${head}<div class="sub">${esc(d.name)} · ${esc(d.address)}</div>`;
}

function render() {
  const bt = state.bluetooth;
  $("subtitle").textContent = `Visible to phones as “${bt.name}”`;

  const pairing = bt.pairing_remaining !== null;
  $("bt-pairing-text").innerHTML = pairing
    ? `<span class="dot warn"></span>Pairing open — on the phone, connect to <b>${esc(bt.name)}</b> (${bt.pairing_remaining}s left)`
    : bt.pin_pairing
      ? `<span class="muted">Phones can pair any time: connect to <b>${esc(bt.name)}</b> and enter the PIN
         from ToothSpin's configuration. Phones that don't ask for one need the pairing window.</span>`
      : `<span class="muted">Add a new phone by opening Bluetooth pairing for two minutes.</span>`;
  const btn = $("bt-pairing-btn");
  btn.textContent = pairing ? "Stop pairing" : "Add phone";
  btn.className = pairing ? "" : "primary";
  btn.onclick = () => post("api/bluetooth/pairing", {open: !pairing});

  const devices = [...state.devices].sort((a, b) => (b.address === myPhone) - (a.address === myPhone));
  $("devices").innerHTML = devices.length ? devices.map((d) => `
    <div class="phone ${d.address === myPhone ? "mine" : ""}">
      ${renderTitle(d)}
      ${renderAudio(d)}
      ${renderSpeakers(d)}
      ${renderSendspin(d)}
      <div class="actions">
        ${d.connected
          ? `<button data-addr="${esc(d.address)}" data-action="disconnect">Disconnect</button>`
          : `<button class="primary" data-addr="${esc(d.address)}" data-action="connect"
               ${pending.has(d.address) ? "disabled" : ""}>${pending.has(d.address) ? "Connecting…" : "Connect"}</button>`}
        <button class="danger" data-addr="${esc(d.address)}" data-action="remove">${confirmRemove === d.address ? "Really remove?" : "Remove"}</button>
      </div>
    </div>`).join("") : `<div class="muted">No phones paired yet.</div>`;
  for (const b of $("devices").querySelectorAll("button[data-action]")) {
    b.onclick = () => {
      if (b.dataset.action === "remove" && confirmRemove !== b.dataset.addr) {
        confirmRemove = b.dataset.addr; render();
        setTimeout(() => { confirmRemove = null; render(); }, 4000);
        return;
      }
      confirmRemove = null;
      const url = `api/bluetooth/devices/${encodeURIComponent(b.dataset.addr)}/${b.dataset.action}`;
      if (b.dataset.action === "connect") {
        pending.add(b.dataset.addr); render();
        post(url).finally(() => { pending.delete(b.dataset.addr); render(); });
      } else {
        post(url);
      }
    };
  }
  for (const b of $("devices").querySelectorAll("button[data-pair]")) {
    b.onclick = () => post(`api/sendspin/${encodeURIComponent(b.dataset.pair)}/pairing`);
  }
  for (const b of $("devices").querySelectorAll("button[data-speaker]")) {
    b.onclick = async () => {
      const key = `${b.dataset.addr}|${b.dataset.speaker}`;
      pending.add(key); render();
      try {
        await post(`api/speakers/${encodeURIComponent(b.dataset.addr)}/toggle`,
                   {player_id: b.dataset.speaker, on: b.dataset.on === "1"});
      } finally {
        pending.delete(key); render();
      }
    };
  }
  for (const b of $("devices").querySelectorAll("button[data-move]")) {
    b.onclick = async () => {
      const key = `${b.dataset.addr}|${b.dataset.move}`;
      pending.add(key); render();
      try {
        await post(`api/speakers/${encodeURIComponent(b.dataset.addr)}/move`, {player_id: b.dataset.move});
      } finally {
        pending.delete(key); render();
      }
    };
  }
  for (const b of $("devices").querySelectorAll("button[data-mine]")) {
    b.onclick = () => setMyPhone(b.dataset.mine);
  }
  for (const input of $("devices").querySelectorAll("input[data-vol]")) {
    input.onpointerdown = () => { sliding = true; };
    input.oninput = () => { input.nextElementSibling.textContent = input.value; };
    input.onchange = async () => {
      sliding = false;
      await post("api/speakers/volume", {player_id: input.dataset.vol, volume: Number(input.value)});
    };
  }
  for (const b of $("devices").querySelectorAll("button[data-hide]")) {
    b.onclick = () => post(`api/speakers/${encodeURIComponent(b.dataset.addr)}/hidden`,
                           {player_id: b.dataset.hide, hidden: b.dataset.hidden === "1"});
  }
  for (const b of $("devices").querySelectorAll("button[data-mute]")) {
    b.onclick = () => post("api/speakers/volume", {player_id: b.dataset.mute, muted: b.dataset.muted === "1"});
  }
  for (const b of $("devices").querySelectorAll("button[data-rename]")) {
    b.onclick = () => {
      editing = b.dataset.rename; render();
      const input = $("name-input"); input.focus(); input.select();
    };
  }
  const save = $("devices").querySelector("button[data-save]");
  if (save) {
    const input = $("name-input");
    const submit = () => {
      const address = save.dataset.save;
      editing = null;
      post(`api/sendspin/${encodeURIComponent(address)}/name`, {name: input.value});
    };
    save.onclick = submit;
    input.onkeydown = (e) => {
      if (e.key === "Enter") submit();
      if (e.key === "Escape") { editing = null; render(); }
    };
    $("devices").querySelector("button[data-cancel]").onclick = () => { editing = null; render(); };
  }
}

async function refresh() {
  try {
    const res = await fetch("api/state");
    state = await res.json();
    if (!editing && !sliding) render();
  } catch (e) {
    $("error").textContent = "Lost connection to the receiver.";
  }
}
// Only takes effect over HTTPS (or localhost); harmless otherwise. Not inside
// Home Assistant's ingress, where the page lives in HA's own origin.
if ("serviceWorker" in navigator && !location.pathname.includes("/hassio_ingress/")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
// A click on a slider without moving it fires no change event.
window.addEventListener("pointerup", () => setTimeout(() => { sliding = false; }, 500));
refresh();
setInterval(refresh, 1500);
</script>
</body>
</html>
