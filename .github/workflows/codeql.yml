name: CodeQL

# GitHub's code scanning: security bugs in the Python, the web UI's
# JavaScript and the workflows. Findings show up under Security → Code
# scanning.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, for new queries.
    - cron: "23 4 * * 1"

permissions:
  contents: read  # check out the code

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # check out the code
      security-events: write  # upload the findings
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
