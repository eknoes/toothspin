name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: pip install -e '.[test]'
      - name: Tests
        run: pytest -q
      - name: Check the web UI's script
        run: |
          python3 - <<'PY'
          html = open("src/toothspin/index.html").read()
          open("/tmp/page.js", "w").write(html[html.index("<script>") + 8 : html.index("</script>")])
          PY
          node --check /tmp/page.js

  app:
    # The Home Assistant App in toothspin/: lint like HA's example repo does,
    # and keep its version (the image tag HA pulls) in step with the package.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint the Home Assistant App
        uses: frenck/action-app-linter@v2.21.1
        with:
          path: ./toothspin
      - name: App version matches the package version
        run: |
          package=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          app=$(python3 -c "import yaml; print(yaml.safe_load(open('toothspin/config.yaml'))['version'])")
          test "$package" = "$app" || { echo "pyproject.toml has $package, toothspin/config.yaml has $app"; exit 1; }

  sbom:
    # SBOM of the image, checked for known vulnerabilities. Fails on high or
    # critical ones that have a fix (an upgrade would remove them); all
    # findings are listed in the job summary.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (amd64) for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          load: true
          tags: toothspin:scan
          cache-from: type=gha
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0.24.2
        with:
          image: toothspin:scan
          format: spdx-json
          output-file: toothspin.spdx.json
          upload-artifact: false
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@v0.24.2
        with:
          image: toothspin:scan
          format: cyclonedx-json
          output-file: toothspin.cdx.json
          upload-artifact: false
      - name: All known vulnerabilities (report)
        uses: anchore/scan-action@v7.4.2
        with:
          sbom: toothspin.spdx.json
          fail-build: false
          output-format: table
          output-file: vulnerabilities.txt
          cache-db: true
      - name: Add the report to the job summary
        run: |
          { echo '## Known vulnerabilities in the image'; echo '```'; cat vulnerabilities.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail on fixable high/critical vulnerabilities
        uses: anchore/scan-action@v7.4.2
        with:
          sbom: toothspin.spdx.json
          only-fixed: true
          severity-cutoff: high
          fail-build: true
          output-format: table
          cache-db: true
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            toothspin.spdx.json
            toothspin.cdx.json
            vulnerabilities.txt

  image:
    needs: [test, app, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/toothspin
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
            type=ref,event=pr
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main/tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Per-architecture SBOM and provenance attestations in the registry.
          sbom: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
          provenance: ${{ (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') && 'mode=max' || 'false' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The commits since the previous release make up the notes.
          fetch-depth: 0
      - name: Check the tag matches the package version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version in pyproject.toml"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: sbom
          path: sbom
      - name: Release notes from the commits (cliff.toml)
        uses: orhun/git-cliff-action@v4.9.1
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: notes.md
      - name: Create the GitHub release with the SBOMs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=${GITHUB_REF_NAME#v}
          mv sbom/toothspin.spdx.json "toothspin-$version.spdx.json"
          mv sbom/toothspin.cdx.json "toothspin-$version.cdx.json"
          {
            cat notes.md
            echo
            echo "Image: \`ghcr.io/${{ github.repository_owner }}/toothspin:$version\`. SBOMs (SPDX, CycloneDX) are attached; the image in the registry also carries SBOM and provenance attestations."
          } > release.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file release.md \
            "toothspin-$version.spdx.json" "toothspin-$version.cdx.json"
