name: Vulnerability scan

# New vulnerabilities are published after an image was built: rescan the
# latest release weekly against grype's current database. A failed run (a
# fixable high or critical vulnerability) means: release again, the rebuild
# picks up Alpine's fixes.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read  # check out the workflow
  packages: read  # pull the released image

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [toothspin, toothspin-standalone]
    steps:
      # For .grype.yaml (false positives).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the latest release
        env:
          IMAGE: ${{ matrix.image }}
        run: docker pull "ghcr.io/$GITHUB_REPOSITORY_OWNER/$IMAGE:latest"
      - name: All known vulnerabilities (report)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          fail-build: false
          output-format: table
          output-file: vulnerabilities.txt
      - name: Add the report to the job summary
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          { echo "## Known vulnerabilities in $IMAGE"; echo '```'; cat vulnerabilities.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail on fixable high/critical vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          only-fixed: true
          severity-cutoff: high
          fail-build: true
          output-format: table
