name: Vulnerability scan

# New vulnerabilities are published after an image was built: rescan the
# latest release weekly against grype's current database. A failed run (a
# fixable high or critical vulnerability) means: release again, the rebuild
# picks up Alpine's fixes.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the latest release
        run: docker pull "ghcr.io/${{ github.repository_owner }}/toothspin:latest"
      - name: All known vulnerabilities (report)
        uses: anchore/scan-action@v7.4.2
        with:
          image: ghcr.io/${{ github.repository_owner }}/toothspin:latest
          fail-build: false
          output-format: table
          output-file: vulnerabilities.txt
      - name: Add the report to the job summary
        run: |
          { echo '## Known vulnerabilities in the latest release'; echo '```'; cat vulnerabilities.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail on fixable high/critical vulnerabilities
        uses: anchore/scan-action@v7.4.2
        with:
          image: ghcr.io/${{ github.repository_owner }}/toothspin:latest
          only-fixed: true
          severity-cutoff: high
          fail-build: true
          output-format: table
