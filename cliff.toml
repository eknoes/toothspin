# Release notes from the conventional commits since the previous release,
# rendered by git-cliff (https://git-cliff.org) in CI when a tag is pushed.
# Preview the next release's notes: git cliff --unreleased

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
# Order of the sections; the HTML comments only sort them.
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^build", group = "<!-- 3 -->Image and dependencies" },
    { message = "^docs", group = "<!-- 4 -->Documentation" },
    { message = "^(ci|chore|test|style|refactor)", skip = true },
]
