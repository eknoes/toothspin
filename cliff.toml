# Changelog and release notes from the conventional commits, rendered by
# git-cliff (https://git-cliff.org): toothspin/CHANGELOG.md (shown by Home
# Assistant before an update) with each release, the GitHub release's notes
# in CI when a tag is pushed. Preview the next release's: git cliff --unreleased

[changelog]
header = """
# Changelog
"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}

"""
footer = ""
trim = false
# One blank line between blocks.
postprocessors = [{ pattern = "\n{3,}", replace = "\n\n" }]

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
# Order of the sections; the HTML comments only sort them.
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^build", group = "<!-- 3 -->Image and dependencies" },
    { message = "^docs", group = "<!-- 4 -->Documentation" },
    { message = "^(ci|chore|test|style|refactor)", skip = true },
]
